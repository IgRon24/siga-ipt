spring.application.name=siga

# ===============================
# IMPORTAR VARIABLES DE ENTORNO
# ===============================
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/siga_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones. El defecto de HikariCP son 10 y con eso el pool es el
# primer cuello de botella bajo carga: medido, 10 activas y ~190 hilos
# esperando mientras Postgres iba en 21 de 100 conexiones (ver perf/README.md).
# El limite real es replicas x pool < max_connections de Postgres (100):
# 2 replicas x 25 = 50, 3 x 25 = 75. En Docker se puede ajustar sin reconstruir
# la imagen con DB_POOL_SIZE (docker-compose.yml).
spring.datasource.hikari.maximum-pool-size=25

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# KEYCLOAK CONFIGURATION
# ===============================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/siga-realm

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# OBSERVABILIDAD
# ===============================
# /actuator/health sigue siendo publico (SecurityConfig) y es el que usan el
# healthcheck de Docker y nginx. /actuator/metrics se agrega para las pruebas de
# carga (pool de conexiones, memoria de la JVM, latencia por endpoint) y exige
# token, porque SecurityConfig solo deja pasar /actuator/health sin autenticar.
management.endpoints.web.exposure.include=health,metrics