# nginx del contenedor del frontend: solo sirve los estaticos del build.
#
# El ruteo de /api y /auth no vive aqui: lo hace el nginx del borde, que es el
# que publica el puerto 80 y balancea hacia las replicas del backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA con React Router: cualquier ruta desconocida devuelve index.html y el
    # ruteo lo resuelve el navegador. Sin esto, recargar /dashboard da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre se pueden cachear sin miedo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea: es el que apunta a los assets nuevos
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
