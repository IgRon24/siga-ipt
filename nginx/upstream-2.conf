# Las replicas del backend que balancea nginx: DOS, el valor por defecto.
#
# Este archivo se monta en /etc/nginx/conf.d/00-upstream.conf y el nginx de la
# imagen lo carga junto con default.conf. Esta aparte justamente para que el
# numero de replicas se cambie sin tocar el resto de la configuracion:
# docker-compose.three.yml monta upstream-3.conf en su lugar.
#
# Round robin; si una responde error o no responde, nginx la marca caida por
# 30 s y manda todo a la otra.
upstream siga_backend {
    server backend-1:8080 max_fails=3 fail_timeout=30s;
    server backend-2:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
