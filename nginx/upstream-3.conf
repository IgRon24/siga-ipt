# Las replicas del backend que balancea nginx: TRES, como pide el plan de
# proyecto. Se activa junto con la tercera replica:
#
#   docker compose -f docker-compose.yml -f docker-compose.three.yml up -d
#
# Son ~640 MB de JVM por replica: en una maquina justa conviene quedarse con
# las dos de upstream-2.conf y levantar las tres solo para la demo o en la nube.
upstream siga_backend {
    server backend-1:8080 max_fails=3 fail_timeout=30s;
    server backend-2:8080 max_fails=3 fail_timeout=30s;
    server backend-3:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
