# nginx del borde: el unico servicio publicado.
#
# Hace dos trabajos:
#   1. Balancea /api entre las replicas del backend y / entre las del frontend,
#      que no publican puertos y solo existen en la red interna de Docker. Los
#      upstreams no se definen aqui: "siga_backend" viene de 00-upstream.conf
#      (que el compose monta desde nginx/upstream-2.conf, dos replicas por
#      defecto, o upstream-3.conf) y "siga_frontend" de 01-upstream-frontend.conf.
#   2. Deja el frontend, la API y Keycloak bajo un mismo origen, de modo que el
#      navegador nunca cruza origenes y no hace falta configurar CORS en Spring
#      ni Web Origins en el realm. Es el mismo esquema del proxy de Vite en
#      desarrollo, por eso el frontend usa /api y /auth relativos.

# El log deja ver a que replica fue cada peticion: es la forma de comprobar el
# balanceo (docker compose logs -f nginx).
log_format siga '$remote_addr "$request" -> $upstream_addr $status ${request_time}s';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log siga;

    # Cuerpos de peticion modestos: la API solo recibe JSON
    client_max_body_size 2m;

    # --- API: balanceada entre las replicas ---
    location /api/ {
        proxy_pass http://siga_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una replica se cae en medio de la peticion, se reintenta en otra
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Swagger y el health check, por la misma ruta balanceada.
    #
    # Sin ancla al final a proposito: springdoc sirve la UI en /swagger-ui.html
    # y pide la especificacion en /v3/api-docs, las dos SIN barra final. Con un
    # patron que exigiera la barra ("...|actuator)/"), esas dos caian en el
    # location / y el navegador recibia el index.html del SPA con un 200.
    # La lista es la misma que SecurityConfig deja pasar sin token.
    location ~ ^/(swagger-ui|v3/api-docs|swagger-resources|webjars|actuator) {
        proxy_pass http://siga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Keycloak bajo /auth ---
    # El contenedor corre con KC_HTTP_RELATIVE_PATH=/auth, asi que la ruta no se
    # reescribe: el issuer de los tokens queda estable en <host>/auth/realms/...
    # y es exactamente el que valida el backend.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --- Frontend: todo lo demas, balanceado entre sus replicas ---
    location / {
        proxy_pass http://siga_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
