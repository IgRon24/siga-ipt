# Las replicas del frontend que balancea nginx.
#
# Va en un archivo propio, montado como /etc/nginx/conf.d/01-upstream-frontend.conf,
# porque lo que cambia entre docker-compose.yml y docker-compose.three.yml es el
# numero de replicas del BACKEND: el frontend no varia y asi no hay que
# repetirlo en los dos archivos de upstream.
#
# Cada replica es nginx sirviendo el bundle estatico (unos 7 MB de RAM, sin
# CPU): el navegador lo descarga una vez y desde ahi todo va a /api. El plan de
# proyecto pide una unica instancia del frontend; aqui hay dos para que el
# balanceo del SPA sea demostrable igual que el de la API.
upstream siga_frontend {
    server frontend-1:80 max_fails=3 fail_timeout=30s;
    server frontend-2:80 max_fails=3 fail_timeout=30s;
    keepalive 16;
}
