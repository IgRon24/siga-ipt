# La TERCERA replica del backend, como pide el plan de proyecto.
#
# Se aplica encima del compose principal (que levanta dos):
#
#   docker compose -f docker-compose.yml -f docker-compose.three.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.three.yml ps
#
# Hace dos cosas: agrega backend-3 y cambia la lista de replicas que balancea
# nginx (monta upstream-3.conf donde el compose principal monta upstream-2.conf,
# y Compose resuelve el conflicto por destino, quedando el de este archivo).
#
# Son ~640 MB mas de RAM. Para la demo o la nube, levantar las tres; en una
# maquina justa, usar solo el compose principal.

name: siga

x-backend: &backend
  image: ${DOCKERHUB_USER:-local}/siga-backend:${TAG:-latest}
  build:
    context: ./backend
  restart: unless-stopped
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-siga_db}
    DB_USERNAME: ${POSTGRES_USER:-siga}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-siga}
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-25}
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${PUBLIC_URL:-http://localhost}/auth/realms/${KC_REALM:-siga-realm}
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/${KC_REALM:-siga-realm}/protocol/openid-connect/certs
    SPRING_JPA_SHOW_SQL: "false"
  expose:
    - "8080"
  mem_limit: 640m
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s
  networks:
    - siga-net

services:
  backend-3:
    <<: *backend
    container_name: siga-backend-3
    # Como las otras: espera a que la primera replica haya creado el esquema.
    depends_on:
      backend-1:
        condition: service_healthy

  nginx:
    # Solo cambia el upstream del backend: el del frontend lo pone el compose
    # principal y Compose fusiona los montajes por destino.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstream-3.conf:/etc/nginx/conf.d/00-upstream.conf:ro
    # nginx resuelve los nombres del upstream al arrancar: si backend-3 todavia
    # no existe, no levanta. Por eso espera a que el contenedor este creado.
    depends_on:
      - frontend-1
      - frontend-2
      - keycloak
      - backend-1
      - backend-2
      - backend-3
